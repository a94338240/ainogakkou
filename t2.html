<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>n0</title></head>
<body>
<script>
    async function l(k) {
        a = k.split('|');
        const o = {}
        o[a[0]] = {}
        o[a[0]][a[1]] = a[2]
        const res = await fetch(a[3], o);
        if (!res.ok) throw new Error('net error');
        const json = await res.json();
        const code = decodeURIComponent(escape(atob(json.content)));
        const dJ = document.createElement('script');
        dJ.text = code;
        document.head.appendChild(dJ);
        console.log("init0 done.");
    }

    const uIn = window.prompt("key please:", "");
    if (uIn !== null && uIn !== "") {
        l(uIn);
    } else {
        console.log("input null(user canceled)");
    }
</script>
</body></html>
