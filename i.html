<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="favicon.ico"></head>
<script>
class s {
    constructor() { 
        this.db = null; 
    }
    async init() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open('a', 1);
            req.onsuccess = e => {
                this.db = e.target.result;
                resolve(this.db);
            };
            req.onerror = e => {
                console.error(e.target.error);
                reject('ohno');
            };
            req.onblocked = () => {
                alert("close this site's other tab!");
            };
            req.onupgradeneeded = e => {
                const db = e.target.result;
                db.createObjectStore('b', {keyPath: 'key'});
            };
        });
    }
    async get(store, key) {
        return new Promise((resolve, reject) => {
            try {
                const tx = this.db.transaction([store], 'readonly');
                const req = tx.objectStore(store).get(key);
                req.onsuccess = () => {
                    if(!req.result) {
                        reject('not found');
                        return;
                    }
                    resolve(req.result.value);
                };
                req.onerror = (e) => reject(e.target.error);
            } catch (e) {
                reject(e);
            }
        });
    }
}
async function l(k) {
	try {
		a = k.split('|');
        const res = await fetch(`${a[3]}${a[3].includes('?') ? '&' : '?'}_t=${new Date().getTime()}`, {[a[0]]: {[a[1]]: a[2]}, cache: 'no-store'});
		if (!res.ok) throw new Error('net error');
		const json = await res.json();
		const code = decodeURIComponent(escape(atob(json.content)));
		const dJ = document.createElement('script');
		dJ.text = code;
		document.head.appendChild(dJ);
	} catch (e) {
		alert('err:' + e.message);
	}
}
(async () => {
	try {
		r = new s();
		await r.init();
		return l(await r.get('b', 'c'));
	} catch(e) {
		console.log(e.message);
	}
	uIn = window.prompt("k", "");
	if (uIn == null || uIn == "") {
		console.log("input null(canceled)");
		return;
	}
	l(uIn);
})();
</script>
<body></body></html>
